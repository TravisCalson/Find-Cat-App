<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找猫猫</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  color: #eee;
  padding: 20px;
}
h1 { font-size: 1.8rem; margin-bottom: 8px; color: #ff6b9d; }
.subtitle { color: #888; margin-bottom: 16px; font-size: 0.95rem; }

.controls {
  display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;
  justify-content: center;
}
button {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.1s;
}
button:active { transform: scale(0.95); }
.btn-next { background: #4ecca3; color: #1a1a2e; font-size: 1.1rem; padding: 14px 32px; }
.btn-reset { background: #ff6b9d; color: #fff; }
.btn-retry { background: #ffd700; color: #1a1a2e; }
.btn-hint { background: #a29bfe; color: #fff; min-width: 140px; }
.btn-hint.cooling {
  background: #444; color: #888; cursor: not-allowed;
}

.status-bar {
  display: flex; gap: 20px; margin-bottom: 16px;
  font-size: 1.1rem; align-items: center; flex-wrap: wrap;
  justify-content: center;
}
.status-bar .item {
  display: flex; align-items: center; gap: 6px;
}
.status-bar .val {
  background: #16213e; padding: 6px 14px; border-radius: 8px;
  font-weight: 700; min-width: 50px; text-align: center;
}
.status-bar .level-val {
  background: #ff6b9d; color: #fff; font-size: 1.15rem;
}
.lives { font-size: 1.3rem; }
.lives .lost { opacity: 0.25; }

#board {
  display: inline-grid;
  gap: 3px;
  background: #0f3460;
  padding: 8px;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(255,107,157,0.15);
}

.cell {
  width: 52px; height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.15s;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
}
.cell:hover { transform: scale(1.05); z-index: 2; }
.cell.no-cat {
  opacity: 0.45;
}
.cell.no-cat::before,
.cell.no-cat::after {
  content: '';
  position: absolute;
  width: 55%;
  height: 3px;
  background: #fff;
  border-radius: 2px;
  box-shadow: 0 0 4px rgba(0,0,0,0.8);
}
.cell.no-cat::before {
  transform: rotate(45deg);
}
.cell.no-cat::after {
  transform: rotate(-45deg);
}
.cell.found {
  animation: pop 0.3s ease;
}
.cell.found::after {
  content: '';
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.cell.wrong {
  animation: shake 0.4s ease;
  background: #e94560 !important;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
.cell.hint-flash {
  animation: hintGlow 1.2s ease-in-out 2;
}
@keyframes hintGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); transform: scale(1); }
  50% { box-shadow: 0 0 16px 6px rgba(255,215,0,0.85); transform: scale(1.12); }
}
.cell.exclude-hint {
  animation: excludePulse 1s ease-in-out infinite;
}
/* 白环+深色描边：与任何区域配色（红/橙/黄/绿/蓝/紫）都区分得开 */
@keyframes excludePulse {
  0%, 100% { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35), inset 0 0 0 6px rgba(26,26,46,0.45); }
  50% { box-shadow: inset 0 0 0 3px rgba(255,255,255,1), inset 0 0 0 6px rgba(26,26,46,0.95), 0 0 12px rgba(255,255,255,0.5); }
}
.cell.solo-hint {
  animation: soloPulse 1s ease-in-out infinite;
}
@keyframes soloPulse {
  0%, 100% { box-shadow: inset 0 0 0 3px rgba(255,215,0,0.2); }
  50% { box-shadow: inset 0 0 0 3px rgba(255,215,0,1); }
}

.message {
  margin-top: 16px;
  padding: 16px 28px;
  border-radius: 12px;
  font-size: 1.15rem;
  font-weight: 700;
  display: none;
  text-align: center;
  line-height: 1.8;
}
.message.win { background: #4ecca3; color: #1a1a2e; display: block; }
.message.lose { background: #e94560; color: #fff; display: block; }
.message .btn-row {
  margin-top: 12px;
  display: flex; gap: 12px; justify-content: center;
}

.rules {
  margin-top: 20px;
  background: #16213e;
  padding: 16px 24px;
  border-radius: 8px;
  max-width: 500px;
  font-size: 0.85rem;
  color: #aaa;
  line-height: 1.8;
}
.rules b { color: #ff6b9d; }

/* 新手引导 */
#tutorial-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
}
#tutorial-overlay.show { display: flex; }
#tutorial-box {
  background: #16213e;
  border: 2px solid #ff6b9d;
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,107,157,0.3);
}
#tutorial-box h2 {
  color: #ff6b9d;
  font-size: 1.3rem;
  margin-bottom: 14px;
}
#tutorial-box p {
  color: #ccc;
  font-size: 1.05rem;
  line-height: 1.8;
  margin-bottom: 20px;
}
#tutorial-box .highlight { color: #ffd700; font-weight: 700; }
#tutorial-box .tutorial-btn {
  padding: 12px 36px;
  border: none;
  border-radius: 8px;
  background: #ff6b9d;
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
}
#tutorial-box .tutorial-btn:active { transform: scale(0.95); }
#tutorial-box .btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 8px;
  flex-wrap: nowrap;
}
#tutorial-box .btn-row .tutorial-btn {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
#tutorial-box .btn-row .btn-primary {
  background: #ff6b9d;
  color: #fff;
}
#tutorial-box .btn-row .btn-secondary {
  background: #3a3a5c;
  color: #ccc;
}
#tut-img {
  margin: 12px auto;
  display: flex;
  justify-content: center;
}
.demo-grid {
  display: inline-grid;
  gap: 3px;
  border-radius: 10px;
  padding: 6px;
  background: rgba(255,255,255,0.06);
}
.demo-cell {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  border-radius: 5px;
  position: relative;
  transition: all 0.3s;
}
.demo-cell.hl-row { box-shadow: 0 0 0 2px #ffd700; z-index: 1; }
.demo-cell.hl-col { box-shadow: 0 0 0 2px #00bfff; z-index: 1; }
.demo-cell.hl-adj { box-shadow: 0 0 0 2px #ff6b9d; z-index: 1; }
.demo-cell.hl-solo { box-shadow: 0 0 0 3px #ffd700, 0 0 12px 4px rgba(255,215,0,0.5); z-index: 2; animation: soloPulse 1s ease-in-out infinite; }
.demo-cell.hl-x { color: #e94560; font-weight: 900; font-size: 22px; }
.demo-arrow {
  text-align: center;
  font-size: 28px;
  margin: 4px 0;
  animation: bounce 1s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.demo-label {
  text-align: center;
  color: #aaa;
  font-size: 0.82rem;
  margin-top: 6px;
  line-height: 1.5;
}
.demo-label .hl { color: #ffd700; font-weight: 700; }
.demo-gesture {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.demo-gesture .gesture-icon {
  font-size: 32px;
  animation: tapPulse 1.2s ease-in-out infinite;
}
@keyframes tapPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
#loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 5000;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
#loading-overlay.show { display: flex; }
#loading-overlay .spinner {
  width: 48px; height: 48px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: #ff6b9d;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay .loading-text {
  color: #fff; font-size: 1.1rem; font-weight: 700;
}
#tutorial-tip {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #ff6b9d;
  color: #fff;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  z-index: 99;
  display: none;
  box-shadow: 0 4px 20px rgba(255,107,157,0.4);
  max-width: 90vw;
  text-align: center;
}
#tutorial-tip.show { display: block; }
#tutorial-tip .tip-step {
  display: inline-block;
  background: rgba(255,255,255,0.25);
  border-radius: 6px;
  padding: 2px 10px;
  margin-right: 8px;
  font-size: 0.85rem;
}
body.tutorial-active h1,
body.tutorial-active .subtitle,
body.tutorial-active .controls,
body.tutorial-active .status-bar,
body.tutorial-active #board,
body.tutorial-active .message,
body.tutorial-active .rules,
body.tutorial-active .footer {
  display: none;
}
</style>
</head>
<body>
<h1>🐱 找猫猫</h1>
<div class="subtitle">找出所有藏起来的猫猫！</div>

<div class="controls">
  <button class="btn-reset" onclick="resetLevel()">🔄 重来本关</button>
  <button class="btn-retry" onclick="prevLevel()">⬅ 上一关</button>
  <button class="btn-next" onclick="nextLevel()">下一关 ➡</button>
  <button class="btn-hint" id="hintBtn" onclick="useHint()">💡 提示</button>
</div>

<div class="status-bar">
  <div class="item">🏆 关卡: <div class="val level-val" id="level">1</div></div>
  <div class="item">❤️ 生命: <div class="val lives" id="lives"></div></div>
  <div class="item">🐱 找到: <div class="val" id="found">0 / 5</div></div>
  <div class="item">⏱️ <div class="val" id="timer">0</div></div>
</div>

<div id="board"></div>

<div class="message" id="message"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">生成猫猫位置中…</div>
</div>

<div id="tutorial-tip"></div>
<div id="tutorial-overlay">
  <div id="tutorial-box">
    <h2 id="tut-title"></h2>
    <div id="tut-img"></div>
    <p id="tut-text"></p>
    <div class="btn-row">
      <button class="tutorial-btn btn-secondary" id="tut-skip" onclick="skipTutorial()">跳过引导</button>
      <button class="tutorial-btn btn-primary" id="tut-btn" onclick="tutorialNext()">下一步</button>
    </div>
  </div>
</div>

<div class="rules">
  <b>规则：</b><br>
  • 每行、每列各有一只猫猫<br>
  • 每种颜色区域各有一只猫猫<br>
  • 猫猫周围 8 格内不能有其他猫猫<br>
  <b>操作：</b><br>
  • <b>双击</b> = 确认这里藏了猫猫（猜错扣一条命）<br>
  • <b>单击</b> = 标记这里没有猫猫（可取消）
</div>

<script>
const COLORS = [
  '#ff2d55', '#00e676', '#ffeb3b', '#00b0ff', '#ff6090',
  '#7c4dff', '#ff80ab', '#ff6d00', '#651fff', '#00e5ff',
  '#ff3d00', '#448aff', '#00c853', '#ffd180', '#18ffff',
  '#ff1744', '#fff176', '#76ff03', '#00bfa5', '#d500f9'
];

function colorDist(hex1, hex2) {
  const r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
  const r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
  return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}

// 色系分组（相近颜色同组，相邻区域必须不同组）
const COLOR_GROUPS = [
  [0, 4, 6, 15],      // 红/粉
  [7, 10, 13],        // 橙
  [2, 16],            // 黄
  [1, 12, 17],        // 绿
  [3, 9, 11, 14, 18], // 青/蓝
  [5, 8, 19]          // 紫
];

let regionColors = []; // regionColors[k] = COLORS 下标

let level, n, grid, cats, revealed, noCat, lives, foundCount, gameTimer, seconds, gameOver;
let clickTimer = null, clickCell = null;
let mouseDown = false, dragActive = false, mouseDownCell = null, visitedInDrag = new Set();
let mouseDownX = 0, mouseDownY = 0;
let levelHistory = {}; // 保存每关的 grid 和 cats
let completedLevels = new Set(); // 已通关的关卡集合
let hintCooldown = false, hintTimer = null, hintSeconds = 0;

// ===== 游戏存档 =====
function saveGameState() {
  try {
    const state = {
      level, n, grid, cats, revealed, noCat, lives, foundCount, seconds, gameOver,
      levelHistory, completedLevels: [...completedLevels], regionColors
    };
    localStorage.setItem('findcats_save', JSON.stringify(state));
  } catch(e) {}
}

function loadGameState() {
  try {
    const raw = localStorage.getItem('findcats_save');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function restoreGameState(s) {
  level = s.level; n = s.n; grid = s.grid; cats = s.cats;
  revealed = s.revealed; noCat = s.noCat; lives = s.lives;
  foundCount = s.foundCount; seconds = s.seconds; gameOver = s.gameOver;
  levelHistory = s.levelHistory || {};
  completedLevels = new Set(s.completedLevels || []);
  regionColors = s.regionColors || [];

  document.getElementById('level').textContent = level;
  document.getElementById('timer').textContent = seconds;
  const msg = document.getElementById('message');
  msg.className = 'message';
  msg.style.display = 'none';
  resetHintButton();
  updateStatus();
  render();

  if (!gameOver) {
    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
      seconds++;
      document.getElementById('timer').textContent = seconds;
      saveGameState();
    }, 1000);
  }
}

function clearSave() {
  try { localStorage.removeItem('findcats_save'); } catch(e) {}
}

function isValidSave(s) {
  return s && typeof s === 'object'
    && Number.isInteger(s.level) && s.level >= 1
    && Number.isInteger(s.n) && s.n >= 5 && s.n <= 12
    && Array.isArray(s.grid) && s.grid.length === s.n
    && Array.isArray(s.cats) && s.cats.length === s.n
    && Array.isArray(s.revealed) && s.revealed.length === s.n
    && Array.isArray(s.noCat) && s.noCat.length === s.n
    && Array.isArray(s.grid[0]) && s.grid[0].length === s.n;
}

let exitWithoutSave = false;
let exiting = false; // 正在退出流程中

// 自动保存：切到后台时保存
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !exitWithoutSave) saveGameState();
});
window.addEventListener('pagehide', () => { if (!exitWithoutSave) saveGameState(); });

function doExit() {
  exiting = true;
  overlayRemove();
  window.removeEventListener('popstate', onPopState);
  // Capacitor 环境下关闭 WebView，浏览器环境下尝试 close
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.exitApp();
  } else {
    window.close();
    // window.close 可能被阻止，退回 history.back
    setTimeout(() => history.back(), 100);
  }
}

function overlayRemove() {
  const el = document.getElementById('exit-dialog');
  if (el) el.remove();
}

// ===== 退出确认对话框（两步） =====
function showExitDialog() {
  if (exiting) return;
  if (document.getElementById('exit-dialog')) {
    // 对话框已打开时再次按返回键：重新推入历史防止跳出
    history.pushState(null, '', location.href);
    return;
  }

  // 第一步：是否退出游戏
  const overlay = document.createElement('div');
  overlay.id = 'exit-dialog';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:4000';
  overlay.innerHTML = `
    <div style="background:#1a1a2e;border:2px solid #e94560;border-radius:16px;padding:28px 24px;text-align:center;max-width:300px">
      <div style="font-size:36px;margin-bottom:12px">🚪</div>
      <div style="font-size:17px;font-weight:700;color:#fff;margin-bottom:12px">要退出游戏吗？</div>
      <div style="display:flex;gap:12px;justify-content:center">
        <button id="exit-yes" style="padding:12px 24px;border:none;border-radius:10px;background:#e94560;color:#fff;font-size:14px;font-weight:700;cursor:pointer">退出</button>
        <button id="exit-no" style="padding:12px 24px;border:none;border-radius:10px;background:#2a2a4a;color:#fff;font-size:14px;font-weight:700;cursor:pointer">取消</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#exit-no').addEventListener('click', () => {
    overlay.remove();
    history.pushState(null, '', location.href);
  });

  overlay.querySelector('#exit-yes').addEventListener('click', () => {
    // 第二步：是否保存进度
    overlay.innerHTML = `
      <div style="background:#1a1a2e;border:2px solid #e94560;border-radius:16px;padding:28px 24px;text-align:center;max-width:300px">
        <div style="font-size:36px;margin-bottom:12px">💾</div>
        <div style="font-size:17px;font-weight:700;color:#fff;margin-bottom:12px">是否保存游戏进度？</div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button id="save-yes" style="padding:12px 20px;border:none;border-radius:10px;background:#4CAF50;color:#fff;font-size:14px;font-weight:700;cursor:pointer">保存</button>
          <button id="save-no" style="padding:12px 20px;border:none;border-radius:10px;background:#666;color:#fff;font-size:14px;font-weight:700;cursor:pointer">不保存</button>
        </div>
      </div>`;

    overlay.querySelector('#save-yes').addEventListener('click', () => {
      saveGameState();
      exitWithoutSave = true; // 防止 beforeunload 再次保存
      doExit();
    });
    overlay.querySelector('#save-no').addEventListener('click', () => {
      exitWithoutSave = true;
      clearSave();
      doExit();
    });
  });
}

function onPopState(e) {
  showExitDialog();
}

// 拦截返回键（Android 返回键 / 浏览器后退）
history.pushState(null, '', location.href);
window.addEventListener('popstate', onPopState);

// Capacitor @capacitor/app 插件：监听 Android 硬件返回键
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App
    && window.Capacitor.Plugins.App.addListener) {
  window.Capacitor.Plugins.App.addListener('backButton', () => {
    showExitDialog();
  });
}

// 浏览器关闭标签页
window.addEventListener('beforeunload', (e) => {
  if (exiting) return; // 用户已通过对话框选择退出，不再弹原生提示
  if (!exitWithoutSave) saveGameState();
  e.preventDefault();
  e.returnValue = '';
});

function getGridSize(lv) {
  if (lv <= 2) return 5; // 新手引导关卡 5×5
  return 5 + Math.floor(Math.random() * 6); // 随机 5~10
}

function showLoading() {
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.remove('show');
}

function newGame(lv) {
  clearInterval(gameTimer);
  level = lv;
  lives = 2;
  foundCount = 0;
  seconds = 0;
  gameOver = false;

  document.getElementById('level').textContent = lv;
  document.getElementById('timer').textContent = '0';
  const msg = document.getElementById('message');
  msg.className = 'message';
  msg.style.display = 'none';
  resetHintButton();

  if (levelHistory[lv]) {
    n = levelHistory[lv].n;
    grid = levelHistory[lv].grid.map(row => [...row]);
    cats = levelHistory[lv].cats.map(row => [...row]);
    regionColors = (levelHistory[lv].regionColors || []).slice();
    afterGenerate();
    return;
  }

  // 生成新关卡：先显示 loading，用 setTimeout 让浏览器渲染遮罩
  showLoading();
  setTimeout(() => {
    n = getGridSize(lv);
    cats = null;
    // 大网格搜索空间大，给更多时间找唯一解
    const deadline = Date.now() + (n >= 8 ? 20000 : 8000);
    while (Date.now() < deadline) {
      generateRegions();
      const sols = countSolutions(grid, n, 2);
      if (sols.length === 1) {
        cats = Array.from({length: n}, () => Array(n).fill(false));
        for (const [r, c] of sols[0]) cats[r][c] = true;
        break;
      }
    }
    if (!cats || cats.length !== n) {
      // 回退：找任意合法解（countSolutions 强制行/列/区域/8邻域约束）
      const anySols = countSolutions(grid, n, 1);
      cats = Array.from({length: n}, () => Array(n).fill(false));
      if (anySols.length > 0) {
        for (const [r, c] of anySols[0]) cats[r][c] = true;
      } else {
        // 极端情况（区域布局无解）：重新生成区域直到有解
        const deadline2 = Date.now() + 5000;
        while (Date.now() < deadline2) {
          generateRegions();
          const s2 = countSolutions(grid, n, 1);
          if (s2.length > 0) {
            for (const [r, c] of s2[0]) cats[r][c] = true;
            break;
          }
        }
      }
    }
    levelHistory[lv] = {
      n: n,
      grid: grid.map(row => [...row]),
      cats: cats.map(row => [...row]),
      regionColors: (regionColors || []).slice()
    };
    hideLoading();
    afterGenerate();
  }, 50);
}

let onGameReady = null;

function afterGenerate() {
  revealed = Array.from({length: n}, () => Array(n).fill(false));
  noCat = Array.from({length: n}, () => Array(n).fill(false));

  updateStatus();
  render();

  gameTimer = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = seconds;
    saveGameState();
  }, 1000);
  saveGameState();

  if (onGameReady) { const fn = onGameReady; onGameReady = null; fn(); }
}

function generateRegions() {
  grid = Array.from({length: n}, () => Array(n).fill(-1));

  // n 个随机种子 = n 个区域
  const allCells = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) allCells.push([i, j]);
  const shuffled = allCells.sort(() => Math.random() - 0.5);
  const seeds = [];
  for (let k = 0; k < n; k++) {
    const [r, c] = shuffled[k];
    grid[r][c] = k;
    seeds.push([r, c]);
  }

  // 多源 BFS 同时扩张，保证区域连续
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const queues = seeds.map(([r, c]) => [[r, c]]);

  while (queues.some(q => q.length > 0)) {
    for (let k = 0; k < n; k++) {
      const q = queues[k];
      const frontier = [];
      while (q.length > 0) {
        const [r, c] = q.shift();
        const neighbors = dirs
          .map(([dr, dc]) => [r + dr, c + dc])
          .sort(() => Math.random() - 0.5);
        for (const [nr, nc] of neighbors) {
          if (nr >= 0 && nr < n && nc >= 0 && nc < n && grid[nr][nc] === -1) {
            grid[nr][nc] = k;
            frontier.push([nr, nc]);
          }
        }
      }
      q.push(...frontier);
    }
  }

  // 低关卡：把部分区域缩成单格（给线索）
  const tinyCount = level <= 2 ? Math.floor(n / 3) : level <= 4 ? Math.floor(n / 5) : 0;
  for (let k = 0; k < tinyCount; k++) {
    const [sr, sc] = seeds[k];
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        if (grid[i][j] !== k || (i === sr && j === sc)) continue;
        for (const [dr, dc] of dirs) {
          const ni = i + dr, nj = j + dc;
          if (ni >= 0 && ni < n && nj >= 0 && nj < n && grid[ni][nj] !== k) {
            grid[i][j] = grid[ni][nj];
            break;
          }
        }
      }
    }
  }

  // 计算区域邻接图
  const adj = Array.from({length: n}, () => new Set());
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const r = grid[i][j];
      if (j + 1 < n && grid[i][j+1] !== r) { adj[r].add(grid[i][j+1]); adj[grid[i][j+1]].add(r); }
      if (i + 1 < n && grid[i+1][j] !== r) { adj[r].add(grid[i+1][j]); adj[grid[i+1][j]].add(r); }
    }
  }

  // 贪心着色：相邻区域必须不同色系
  const groupForRegion = Array(n).fill(-1);
  const usedGroups = Array.from({length: n}, () => new Set());
  const order = [...Array(n).keys()].sort((a, b) => adj[b].size - adj[a].size);
  for (const k of order) {
    const blocked = new Set();
    for (const nb of adj[k]) {
      if (groupForRegion[nb] >= 0) blocked.add(groupForRegion[nb]);
    }
    let bestGroup = -1, bestCount = Infinity;
    for (let g = 0; g < COLOR_GROUPS.length; g++) {
      if (blocked.has(g)) continue;
      const cnt = COLOR_GROUPS[g].length;
      if (cnt < bestCount) { bestCount = cnt; bestGroup = g; }
    }
    if (bestGroup === -1) {
      // 所有组都被邻接占用，选冲突最少的
      let minConflict = Infinity;
      for (let g = 0; g < COLOR_GROUPS.length; g++) {
        let conflict = 0;
        for (const nb of adj[k]) if (groupForRegion[nb] === g) conflict++;
        if (conflict < minConflict) { minConflict = conflict; bestGroup = g; }
      }
    }
    groupForRegion[k] = bestGroup;
    usedGroups[k].add(bestGroup);
  }

  // 每组内分配具体颜色，且相邻区域颜色 RGB 距离 > 80
  regionColors = Array(n).fill(-1);
  const colorUsed = new Set();
  const MIN_DIST = 80;
  for (const k of order) {
    const g = groupForRegion[k];
    // 收集邻接区域已用的颜色
    const neighborColors = [];
    for (const nb of adj[k]) {
      if (regionColors[nb] >= 0) {
        neighborColors.push(COLORS[regionColors[nb]]);
      }
    }
    // 先在本色系里找满足距离要求的颜色
    const avail = COLOR_GROUPS[g].filter(c => {
      if (colorUsed.has(c)) return false;
      return neighborColors.every(nc => colorDist(COLORS[c], nc) >= MIN_DIST);
    });
    let pick;
    if (avail.length > 0) {
      pick = avail[Math.floor(Math.random() * avail.length)];
    } else {
      // 本色系没有合适的，从全局找距离最大的
      let best = -1, bestDist = -1;
      for (let c = 0; c < COLORS.length; c++) {
        if (colorUsed.has(c)) continue;
        let minD = neighborColors.length === 0 ? Infinity : Infinity;
        for (const nc of neighborColors) {
          minD = Math.min(minD, colorDist(COLORS[c], nc));
        }
        if (minD > bestDist) { bestDist = minD; best = c; }
      }
      pick = best >= 0 ? best : COLOR_GROUPS[g][0];
    }
    regionColors[k] = pick;
    colorUsed.add(pick);
  }
}

function countSolutions(g, size, maxCount) {
  const solutions = [];
  const available = Array.from({length: size}, () => Array(size).fill(true));
  const rowDone = Array(size).fill(false);
  const regionUsed = Array(size).fill(false);
  const placed = [];

  function mark(r, c, changes) {
    function set(i, j) { if (available[i][j]) { available[i][j] = false; changes.push([i, j]); } }
    for (let i = 0; i < size; i++) set(r, i);
    for (let i = 0; i < size; i++) set(i, c);
    const reg = g[r][c];
    for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) if (g[i][j] === reg) set(i, j);
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < size && nc >= 0 && nc < size) set(nr, nc);
    }
  }

  function backtrack() {
    if (solutions.length >= maxCount) return;
    if (placed.length === size) { solutions.push([...placed]); return; }
    let bestRow = -1, bestCols = null;
    for (let r = 0; r < size; r++) {
      if (rowDone[r]) continue;
      const cols = [];
      for (let c = 0; c < size; c++) if (available[r][c]) cols.push(c);
      if (cols.length === 0) return;
      if (!bestCols || cols.length < bestCols.length) { bestRow = r; bestCols = cols; }
    }
    rowDone[bestRow] = true;
    for (const c of bestCols) {
      const reg = g[bestRow][c];
      if (regionUsed[reg]) continue;
      const changes = [];
      mark(bestRow, c, changes);
      regionUsed[reg] = true;
      placed.push([bestRow, c]);
      backtrack();
      placed.pop();
      regionUsed[reg] = false;
      for (const [i, j] of changes) available[i][j] = true;
      if (solutions.length >= maxCount) break;
    }
    rowDone[bestRow] = false;
  }

  backtrack();
  return solutions;
}

function render() {
  const boardEl = document.getElementById('board');
  // 自适应格子大小，确保不超出屏幕
  const maxW = Math.min(window.innerWidth - 32, 600);
  const gap = 3, pad = 16;
  const cellSize = Math.floor((maxW - pad - gap * (n - 1)) / n);
  const cs = Math.max(28, Math.min(cellSize, n <= 6 ? 52 : n <= 8 ? 46 : 42));
  boardEl.style.gridTemplateColumns = `repeat(${n}, ${cs}px)`;
  boardEl.innerHTML = '';

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.background = COLORS[regionColors[grid[i][j]]];
      cell.style.width = cs + 'px';
      cell.style.height = cs + 'px';
      cell.style.fontSize = (cs * 0.55) + 'px';
      cell.dataset.row = i;
      cell.dataset.col = j;

      if (revealed[i][j]) {
        cell.classList.add('found');
        cell.textContent = '🐱';
      } else if (noCat[i][j]) {
        cell.classList.add('no-cat');
      }

      cell.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || gameOver) return;
        e.preventDefault();
        mouseDown = true;
        dragActive = false;
        mouseDownCell = {row: i, col: j};
        mouseDownX = e.clientX;
        mouseDownY = e.clientY;
        visitedInDrag = new Set([i * n + j]);
      });

      cell.addEventListener('mouseenter', (e) => {
        if (!mouseDown || gameOver) return;
        const key = i * n + j;
        if (visitedInDrag.has(key)) return;
        const dist = Math.sqrt((e.clientX - mouseDownX) ** 2 + (e.clientY - mouseDownY) ** 2);
        if (dist < 15) return;
        visitedInDrag.add(key);
        if (revealed[i][j]) return;
        if (!dragActive) {
          dragActive = true;
          const {row: si, col: sj} = mouseDownCell;
          if (!revealed[si][sj]) {
            noCat[si][sj] = !noCat[si][sj];
            updateCell(si, sj);
          }
        }
        noCat[i][j] = !noCat[i][j];
        updateCell(i, j);
      });

      // 触摸开始
      cell.addEventListener('touchstart', (e) => {
        if (gameOver) return;
        e.preventDefault();
        const t = e.touches[0];
        mouseDown = true;
        dragActive = false;
        mouseDownCell = {row: i, col: j};
        mouseDownX = t.clientX;
        mouseDownY = t.clientY;
        visitedInDrag = new Set([i * n + j]);
      }, {passive: false});

      boardEl.appendChild(cell);
    }
  }
}

function updateCell(i, j) {
  const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
  if (!cell) return;
  if (revealed[i][j]) {
    if (!cell.classList.contains('found')) {
      cell.classList.remove('no-cat');
      cell.classList.add('found');
      cell.textContent = '🐱';
    }
    return;
  }
  cell.classList.remove('found');
  cell.textContent = '';
  if (noCat[i][j]) {
    cell.classList.add('no-cat');
  } else {
    cell.classList.remove('no-cat');
  }
}

function clearExcludeHints() {
  document.querySelectorAll('.exclude-hint, .solo-hint').forEach(el => {
    el.classList.remove('exclude-hint', 'solo-hint');
  });
}

function highlightSingleCellRegions() {
  // 找出所有"只有 1 格"的颜色区域，金色脉冲提示这里一定有猫
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const reg = grid[i][j];
      let count = 0;
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (grid[r][c] === reg) count++;
      if (count === 1 && !revealed[i][j]) {
        const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
        if (cell) cell.classList.add('solo-hint');
      }
    }
  }
}

function handleClick(i, j) {
  if (gameOver || revealed[i][j]) return;
  clearExcludeHints();
  noCat[i][j] = !noCat[i][j];
  updateCell(i, j);
  saveGameState();
  checkTutorialProgress();
}

function handleDouble(i, j) {
  if (gameOver || revealed[i][j]) return;
  clearExcludeHints();

  if (cats[i][j]) {
    revealed[i][j] = true;
    noCat[i][j] = false;
    foundCount++;
    updateStatus();
    updateCell(i, j);
    if (navigator.vibrate) navigator.vibrate(50);

    if (foundCount === n) {
      win();
    } else {
      checkTutorialProgress();
    }
  } else {
    lives--;
    updateStatus();

    updateCell(i, j);
    const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
    if (cell) {
      cell.classList.add('wrong');
      setTimeout(() => cell.classList.remove('wrong'), 500);
    }

    if (lives <= 0) {
      lose();
    }
  }
  saveGameState();
}

function useHint() {
  if (hintCooldown || gameOver) return;

  // 找一只还没被发现的猫
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (cats[i][j] && !revealed[i][j]) {
        revealed[i][j] = true;
        noCat[i][j] = false;
        foundCount++;
        updateStatus();
        updateCell(i, j);
        const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
        if (cell) {
          cell.classList.remove('hint-flash');
          void cell.offsetWidth; // 强制重排以重启动画
          cell.classList.add('hint-flash');
          setTimeout(() => cell.classList.remove('hint-flash'), 2600);
        }
        if (navigator.vibrate) navigator.vibrate(50);
        if (foundCount === n) win();
        startHintCooldown();
        return;
      }
    }
  }
}

function startHintCooldown() {
  hintCooldown = true;
  hintSeconds = 40;
  const btn = document.getElementById('hintBtn');
  btn.classList.add('cooling');
  btn.textContent = `💡 冷却 ${hintSeconds}s`;
  hintTimer = setInterval(() => {
    hintSeconds--;
    if (hintSeconds <= 0) {
      clearInterval(hintTimer);
      hintCooldown = false;
      btn.classList.remove('cooling');
      btn.textContent = '💡 提示';
    } else {
      btn.textContent = `💡 冷却 ${hintSeconds}s`;
    }
  }, 1000);
}

function resetHintButton() {
  clearInterval(hintTimer);
  hintCooldown = false;
  hintSeconds = 0;
  const btn = document.getElementById('hintBtn');
  if (btn) {
    btn.classList.remove('cooling');
    btn.textContent = '💡 提示';
  }
}

function updateStatus() {
  document.getElementById('found').textContent = `${foundCount} / ${n}`;

  let hearts = '';
  for (let i = 0; i < 2; i++) {
    hearts += i < lives ? '❤️' : '🖤';
  }
  document.getElementById('lives').innerHTML = hearts;
}

function win() {
  gameOver = true;
  completedLevels.add(level);
  clearInterval(gameTimer);
  saveGameState();
  const msg = document.getElementById('message');
  msg.className = 'message win';
  msg.style.display = 'block';
  msg.innerHTML = `🎉 第 ${level} 关通关！<br>找到所有 ${n} 只猫猫！用时 ${seconds} 秒
    <div class="btn-row">
      <button class="btn-next" onclick="nextLevel()">下一关 ➡</button>
      <button class="btn-reset" onclick="resetLevel()">再玩一次</button>
    </div>`;
}

function lose() {
  gameOver = true;
  clearInterval(gameTimer);
  saveGameState();

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (cats[i][j]) revealed[i][j] = true;
    }
  }
  render();

  const msg = document.getElementById('message');
  msg.className = 'message lose';
  msg.style.display = 'block';
  msg.innerHTML = `💔 第 ${level} 关失败！还差 ${n - foundCount} 只猫猫没找到
    <div class="btn-row">
      <button class="btn-retry" onclick="resetLevel()">再来一次</button>
    </div>`;
}

function nextLevel() {
  // 已通关 或 当前已胜利（防止 completedLevels 状态丢失）
  const won = completedLevels.has(level) || (gameOver && foundCount === n);
  if (!won) {
    const msg = document.getElementById('message');
    msg.className = 'message lose';
    msg.style.display = 'block';
    msg.innerHTML = '⚠️ 请先通关当前关卡！';
    setTimeout(() => {
      msg.className = 'message';
      msg.style.display = 'none';
    }, 1500);
    return;
  }
  completedLevels.add(level);
  newGame(level + 1);
}

function prevLevel() {
  if (level > 1) newGame(level - 1);
}

function resetLevel() {
  // 只清空标记和状态，不重新生成
  clearInterval(gameTimer);
  resetHintButton();
  lives = 2;
  foundCount = 0;
  seconds = 0;
  gameOver = false;
  revealed = Array.from({length: n}, () => Array(n).fill(false));
  noCat = Array.from({length: n}, () => Array(n).fill(false));

  document.getElementById('timer').textContent = '0';
  const msg = document.getElementById('message');
  msg.className = 'message';
  msg.style.display = 'none';

  updateStatus();
  render();

  gameTimer = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = seconds;
    saveGameState();
  }, 1000);
  saveGameState();
}

let tutStep = 0;

function showTutorial() {
  tutStep = 0;
  renderTutStep();
  document.getElementById('tutorial-overlay').classList.add('show');
  document.body.classList.add('tutorial-active');
}

function renderTutStep() {
  const s = TUTORIAL_STEPS[tutStep];
  document.getElementById('tut-title').textContent = s.title;
  document.getElementById('tut-img').innerHTML = s.img || '';
  document.getElementById('tut-text').innerHTML = s.text;
  const btn = document.getElementById('tut-btn');
  btn.textContent = tutStep < TUTORIAL_STEPS.length - 1 ? '下一步' : '开始游戏！';
}

function skipTutorial() {
  document.getElementById('tutorial-overlay').classList.remove('show');
  document.body.classList.remove('tutorial-active');
  tutorialStep = 0;
  try { localStorage.setItem('findcats_tutorial_done', '1'); } catch(e) {}
  newGame(1);
}

function tutorialNext() {
  tutStep++;
  if (tutStep >= TUTORIAL_STEPS.length) {
    document.getElementById('tutorial-overlay').classList.remove('show');
    document.body.classList.remove('tutorial-active');
    tutorialStep = 0;
    try { localStorage.setItem('findcats_tutorial_done', '1'); } catch(e) {}
    // 开始教程关卡
    onGameReady = () => {
      showTip('🎯 先找<span style="font-weight:900">只有 1 格</span>的颜色区域，双击那格找到猫猫！', 1);
      highlightSingleCellRegions();
    };
    newGame(1);
    return;
  }
  renderTutStep();
}

function showTip(html, step) {
  const tip = document.getElementById('tutorial-tip');
  tip.innerHTML = `<span class="tip-step">引导 ${step}</span>${html}`;
  tip.classList.add('show');
  tutorialStep = step;
}

function hideTip() {
  document.getElementById('tutorial-tip').classList.remove('show');
  tutorialStep = 0;
}

function highlightExclusionCells(catR, catC) {
  // 找出该猫同行、同列、8邻域、同颜色区域的未翻开格子，红色边框脉冲提示可标 ✗
  const excludeSet = new Set();
  const reg = grid[catR][catC];
  for (let j = 0; j < n; j++) excludeSet.add(catR * n + j);   // 同行
  for (let i = 0; i < n; i++) excludeSet.add(i * n + catC);   // 同列
  for (let dr = -1; dr <= 1; dr++)                            // 8邻域
    for (let dc = -1; dc <= 1; dc++) {
      const nr = catR + dr, nc = catC + dc;
      if (nr >= 0 && nr < n && nc >= 0 && nc < n) excludeSet.add(nr * n + nc);
    }
  for (let i = 0; i < n; i++)                                 // 同颜色区域
    for (let j = 0; j < n; j++)
      if (grid[i][j] === reg) excludeSet.add(i * n + j);
  excludeSet.delete(catR * n + catC);                          // 除去猫本身

  for (const idx of excludeSet) {
    const r = Math.floor(idx / n), c = idx % n;
    if (revealed[r][c] || noCat[r][c]) continue;
    const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
    if (cell) {
      cell.classList.add('exclude-hint');
    }
  }
}

function checkTutorialProgress() {
  if (tutorialStep === 1 && foundCount >= 1) {
    // 找到第一只猫，高亮可排除的格子
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        if (cats[i][j] && revealed[i][j]) {
          highlightExclusionCells(i, j);
          break;
        }
      }
    }
    showTip('👍 没错！接下来<span style="font-weight:900">单击</span>闪烁的格子标记 ✗，排除没有猫猫的格子', 2);
  } else if (tutorialStep === 2 && noCat.flat().some(Boolean)) {
    showTip('🎯 很好！继续找猫猫，记住规则：<span style="font-weight:900">每行每列每个颜色区域</span>各一只', 3);
  } else if (tutorialStep === 3 && foundCount >= 2) {
    showTip('🎉 你已经会玩了！找到所有猫猫通关吧！', 4);
    setTimeout(hideTip, 4000);
  }
}

// Init
const _tutorialDone = (() => { try { return localStorage.getItem('findcats_tutorial_done'); } catch(e) { return true; } })();
if (_tutorialDone) {
  const saved = loadGameState();
  if (saved && isValidSave(saved) && !saved.gameOver) {
    // 有未完成的存档，弹出提示
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:3000';
    overlay.innerHTML = `
      <div style="background:#1a1a2e;border:2px solid #e94560;border-radius:16px;padding:30px 24px;text-align:center;max-width:320px">
        <div style="font-size:36px;margin-bottom:12px">🐱</div>
        <div style="font-size:18px;font-weight:700;color:#fff;margin-bottom:8px">发现未完成的游戏</div>
        <div style="font-size:14px;color:#aaa;margin-bottom:20px">第 ${saved.level} 关（${saved.n}×${saved.n}）<br>已找到 ${saved.foundCount}/${saved.n} 只猫猫</div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button id="btn-continue" style="padding:12px 24px;border:none;border-radius:10px;background:#e94560;color:#fff;font-size:15px;font-weight:700;cursor:pointer">继续游戏</button>
          <button id="btn-new" style="padding:12px 24px;border:none;border-radius:10px;background:#2a2a4a;color:#fff;font-size:15px;font-weight:700;cursor:pointer">新游戏</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#btn-continue').addEventListener('click', () => {
      overlay.remove();
      restoreGameState(saved);
    });
    overlay.querySelector('#btn-new').addEventListener('click', () => {
      overlay.remove();
      clearSave();
      newGame(1);
    });
  } else {
    // 已通关或无效存档：保留 completedLevels 和 levelHistory，重开
    if (saved && isValidSave(saved)) {
      completedLevels = new Set(saved.completedLevels || []);
      levelHistory = saved.levelHistory || {};
    } else if (saved) {
      clearSave(); // 无效存档，清除
    }
    newGame(1);
  }
} else {
  showTutorial();
}

document.addEventListener('mouseup', () => {
  if (!mouseDown) return;
  mouseDown = false;
  if (dragActive) {
    dragActive = false;
    mouseDownCell = null;
    visitedInDrag.clear();
    checkTutorialProgress();
    return;
  }
  if (mouseDownCell) {
    const {row: i, col: j} = mouseDownCell;
    mouseDownCell = null;
    if (clickCell && clickCell.row === i && clickCell.col === j) {
      clearTimeout(clickTimer);
      clickCell = null;
      if (!revealed[i][j]) { noCat[i][j] = !noCat[i][j]; updateCell(i, j); }
      handleDouble(i, j);
    } else {
      clearTimeout(clickTimer);
      handleClick(i, j);
      clickCell = {row: i, col: j};
      clickTimer = setTimeout(() => {
        clickCell = null;
      }, 280);
    }
  }
});

// 触摸移动：拖动标记
document.addEventListener('touchmove', (e) => {
  if (!mouseDown || gameOver) return;
  e.preventDefault();
  const t = e.touches[0];
  const dist = Math.hypot(t.clientX - mouseDownX, t.clientY - mouseDownY);
  if (!dragActive && dist > 15) {
    dragActive = true;
    clearExcludeHints();
    const {row: si, col: sj} = mouseDownCell;
    if (!revealed[si][sj]) {
      noCat[si][sj] = !noCat[si][sj];
      updateCell(si, sj);
    }
  }
  if (!dragActive) return;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && el.dataset && el.dataset.row !== undefined) {
    const r = parseInt(el.dataset.row), c = parseInt(el.dataset.col);
    const key = r * n + c;
    if (!visitedInDrag.has(key)) {
      visitedInDrag.add(key);
      if (!revealed[r][c]) {
        noCat[r][c] = !noCat[r][c];
        updateCell(r, c);
      }
    }
  }
}, {passive: false});

// 触摸结束：点击/双击检测
document.addEventListener('touchend', (e) => {
  if (!mouseDown) return;
  mouseDown = false;
  if (dragActive) {
    dragActive = false;
    mouseDownCell = null;
    visitedInDrag.clear();
    checkTutorialProgress();
    return;
  }
  if (mouseDownCell) {
    const {row: i, col: j} = mouseDownCell;
    mouseDownCell = null;
    if (clickCell && clickCell.row === i && clickCell.col === j) {
      clearTimeout(clickTimer);
      clickCell = null;
      if (!revealed[i][j]) { noCat[i][j] = !noCat[i][j]; updateCell(i, j); }
      handleDouble(i, j);
    } else {
      clearTimeout(clickTimer);
      handleClick(i, j);
      clickCell = {row: i, col: j};
      clickTimer = setTimeout(() => {
        clickCell = null;
      }, 280);
    }
  }
});

// 触摸取消：防止状态卡住
document.addEventListener('touchcancel', () => {
  mouseDown = false;
  dragActive = false;
  mouseDownCell = null;
  visitedInDrag.clear();
});
