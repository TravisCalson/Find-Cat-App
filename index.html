<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>找猫猫</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  color: #eee;
  padding: 20px;
}
h1 { font-size: 1.8rem; margin-bottom: 8px; color: #ff6b9d; }
.subtitle { color: #888; margin-bottom: 16px; font-size: 0.95rem; }

.controls {
  display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;
  justify-content: center;
}
button {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.1s;
}
button:active { transform: scale(0.95); }
.btn-next { background: #4ecca3; color: #1a1a2e; font-size: 1.1rem; padding: 14px 32px; }
.btn-reset { background: #ff6b9d; color: #fff; }
.btn-retry { background: #ffd700; color: #1a1a2e; }
.btn-hint { background: #a29bfe; color: #fff; min-width: 140px; }
.btn-hint.cooling {
  background: #444; color: #888; cursor: not-allowed;
}

.status-bar {
  display: flex; gap: 20px; margin-bottom: 16px;
  font-size: 1.1rem; align-items: center; flex-wrap: wrap;
  justify-content: center;
}
.status-bar .item {
  display: flex; align-items: center; gap: 6px;
}
.status-bar .val {
  background: #16213e; padding: 6px 14px; border-radius: 8px;
  font-weight: 700; min-width: 50px; text-align: center;
}
.status-bar .level-val {
  background: #ff6b9d; color: #fff; font-size: 1.15rem;
}
.lives { font-size: 1.3rem; }
.lives .lost { opacity: 0.25; }

#board {
  display: inline-grid;
  gap: 3px;
  background: #0f3460;
  padding: 8px;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(255,107,157,0.15);
  touch-action: none;
  -webkit-touch-callout: none;
}

.cell {
  width: 52px; height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.15s;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
}
.cell:hover { transform: scale(1.05); z-index: 2; }
.cell.no-cat {
  opacity: 0.45;
}
.cell.no-cat::after {
  content: '✗';
  position: absolute;
  font-size: 1.8rem;
  color: #fff;
  font-weight: 900;
  text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.5);
}
.cell.found {
  animation: pop 0.3s ease;
}
.cell.found::after {
  content: '';
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.cell.wrong {
  animation: shake 0.4s ease;
  background: #e94560 !important;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.message {
  margin-top: 16px;
  padding: 16px 28px;
  border-radius: 12px;
  font-size: 1.15rem;
  font-weight: 700;
  display: none;
  text-align: center;
  line-height: 1.8;
}
.message.win { background: #4ecca3; color: #1a1a2e; display: block; }
.message.lose { background: #e94560; color: #fff; display: block; }
.message .btn-row {
  margin-top: 12px;
  display: flex; gap: 12px; justify-content: center;
}

.rules {
  margin-top: 20px;
  background: #16213e;
  padding: 16px 24px;
  border-radius: 8px;
  max-width: 500px;
  font-size: 0.85rem;
  color: #aaa;
  line-height: 1.8;
}
.rules b { color: #ff6b9d; }

/* 新手引导 */
#tutorial-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
}
#tutorial-overlay.show { display: flex; }
#tutorial-box {
  background: #16213e;
  border: 2px solid #ff6b9d;
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,107,157,0.3);
}
#tutorial-box h2 {
  color: #ff6b9d;
  font-size: 1.3rem;
  margin-bottom: 14px;
}
#tutorial-box p {
  color: #ccc;
  font-size: 1.05rem;
  line-height: 1.8;
  margin-bottom: 20px;
}
#tutorial-box .highlight { color: #ffd700; font-weight: 700; }
#tutorial-box .tutorial-btn {
  padding: 12px 36px;
  border: none;
  border-radius: 8px;
  background: #ff6b9d;
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
}
#tutorial-box .tutorial-btn:active { transform: scale(0.95); }
#tutorial-tip {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #ff6b9d;
  color: #fff;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  z-index: 99;
  display: none;
  box-shadow: 0 4px 20px rgba(255,107,157,0.4);
  max-width: 90vw;
  text-align: center;
}
#tutorial-tip.show { display: block; }
#tutorial-tip .tip-step {
  display: inline-block;
  background: rgba(255,255,255,0.25);
  border-radius: 6px;
  padding: 2px 10px;
  margin-right: 8px;
  font-size: 0.85rem;
}
</style>
</head>
<body>
<h1>🐱 找猫猫</h1>
<div class="subtitle">找出所有藏起来的猫猫！</div>

<div class="controls">
  <button class="btn-reset" onclick="resetLevel()">🔄 重来本关</button>
  <button class="btn-retry" onclick="prevLevel()">⬅ 上一关</button>
  <button class="btn-next" onclick="nextLevel()">下一关 ➡</button>
  <button class="btn-hint" id="hintBtn" onclick="useHint()">💡 提示</button>
</div>

<div class="status-bar">
  <div class="item">🏆 关卡: <div class="val level-val" id="level">1</div></div>
  <div class="item">❤️ 生命: <div class="val lives" id="lives"></div></div>
  <div class="item">🐱 找到: <div class="val" id="found">0 / 5</div></div>
  <div class="item">⏱️ <div class="val" id="timer">0</div></div>
</div>

<div id="board"></div>

<div class="message" id="message"></div>

<div id="tutorial-tip"></div>
<div id="tutorial-overlay">
  <div id="tutorial-box">
    <h2 id="tut-title"></h2>
    <p id="tut-text"></p>
    <button class="tutorial-btn" id="tut-btn" onclick="tutorialNext()">下一步</button>
    <button class="tutorial-btn" id="tut-skip" onclick="skipTutorial()" style="background:#555;margin-left:12px;">跳过引导</button>
  </div>
</div>

<div class="rules">
  <b>规则：</b><br>
  • 每行、每列各有一只猫猫<br>
  • 每种颜色区域各有一只猫猫<br>
  • 猫猫周围 8 格内不能有其他猫猫<br>
  <b>操作：</b><br>
  • <b>双击</b> = 确认这里藏了猫猫（猜错扣一条命）<br>
  • <b>单击</b> = 标记这里没有猫猫（可取消）
</div>

<script>
const COLORS = [
  '#ff2d55', '#00e676', '#ffeb3b', '#00b0ff', '#ff6090',
  '#7c4dff', '#ff80ab', '#ff6d00', '#651fff', '#00e5ff',
  '#ff3d00', '#448aff', '#00c853', '#ffd180', '#18ffff',
  '#ff1744', '#fff176', '#76ff03', '#00bfa5', '#d500f9'
];

function colorDist(hex1, hex2) {
  const r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
  const r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
  return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}

// 色系分组（相近颜色同组，相邻区域必须不同组）
const COLOR_GROUPS = [
  [0, 4, 6, 15],      // 红/粉
  [7, 10, 13],        // 橙
  [2, 16],            // 黄
  [1, 12, 17],        // 绿
  [3, 9, 11, 14, 18], // 青/蓝
  [5, 8, 19]          // 紫
];

let regionColors = []; // regionColors[k] = COLORS 下标

let level, n, grid, cats, revealed, noCat, lives, foundCount, gameTimer, seconds, gameOver;
let clickTimer = null, clickCell = null;
let mouseDown = false, dragActive = false, mouseDownCell = null, visitedInDrag = new Set();
let mouseDownX = 0, mouseDownY = 0;
let levelHistory = {}; // 保存每关的 grid 和 cats
let hintCooldown = false, hintTimer = null, hintSeconds = 0;

function getGridSize(lv) {
  if (lv <= 2) return 5; // 新手引导关卡 5×5
  return 5 + Math.floor(Math.random() * 6); // 随机 5~10
}

function newGame(lv) {
  clearInterval(gameTimer);
  level = lv;
  lives = 2;
  foundCount = 0;
  seconds = 0;
  gameOver = false;

  document.getElementById('level').textContent = lv;
  document.getElementById('timer').textContent = '0';
  const msg = document.getElementById('message');
  msg.className = 'message';
  msg.style.display = 'none';
  resetHintButton();

  if (levelHistory[lv]) {
    // 已有存档，直接读取
    n = levelHistory[lv].n;
    grid = levelHistory[lv].grid.map(row => [...row]);
    cats = levelHistory[lv].cats.map(row => [...row]);
  } else {
    // 新关卡，生成并保存
    n = getGridSize(lv);
    generateRegions();
    placeCats();
    levelHistory[lv] = {
      n: n,
      grid: grid.map(row => [...row]),
      cats: cats.map(row => [...row])
    };
  }

  revealed = Array.from({length: n}, () => Array(n).fill(false));
  noCat = Array.from({length: n}, () => Array(n).fill(false));

  updateStatus();
  render();

  gameTimer = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = seconds;
  }, 1000);
}

function generateRegions() {
  grid = Array.from({length: n}, () => Array(n).fill(-1));

  // n 个随机种子 = n 个区域
  const allCells = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) allCells.push([i, j]);
  const shuffled = allCells.sort(() => Math.random() - 0.5);
  const seeds = [];
  for (let k = 0; k < n; k++) {
    const [r, c] = shuffled[k];
    grid[r][c] = k;
    seeds.push([r, c]);
  }

  // 多源 BFS 同时扩张，保证区域连续
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const queues = seeds.map(([r, c]) => [[r, c]]);

  while (queues.some(q => q.length > 0)) {
    for (let k = 0; k < n; k++) {
      const q = queues[k];
      const frontier = [];
      while (q.length > 0) {
        const [r, c] = q.shift();
        const neighbors = dirs
          .map(([dr, dc]) => [r + dr, c + dc])
          .sort(() => Math.random() - 0.5);
        for (const [nr, nc] of neighbors) {
          if (nr >= 0 && nr < n && nc >= 0 && nc < n && grid[nr][nc] === -1) {
            grid[nr][nc] = k;
            frontier.push([nr, nc]);
          }
        }
      }
      q.push(...frontier);
    }
  }

  // 低关卡：把部分区域缩成单格（给线索）
  const tinyCount = level <= 2 ? Math.floor(n / 3) : level <= 4 ? Math.floor(n / 5) : 0;
  for (let k = 0; k < tinyCount; k++) {
    const [sr, sc] = seeds[k];
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        if (grid[i][j] !== k || (i === sr && j === sc)) continue;
        for (const [dr, dc] of dirs) {
          const ni = i + dr, nj = j + dc;
          if (ni >= 0 && ni < n && nj >= 0 && nj < n && grid[ni][nj] !== k) {
            grid[i][j] = grid[ni][nj];
            break;
          }
        }
      }
    }
  }

  // 计算区域邻接图
  const adj = Array.from({length: n}, () => new Set());
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const r = grid[i][j];
      if (j + 1 < n && grid[i][j+1] !== r) { adj[r].add(grid[i][j+1]); adj[grid[i][j+1]].add(r); }
      if (i + 1 < n && grid[i+1][j] !== r) { adj[r].add(grid[i+1][j]); adj[grid[i+1][j]].add(r); }
    }
  }

  // 贪心着色：相邻区域必须不同色系
  const groupForRegion = Array(n).fill(-1);
  const usedGroups = Array.from({length: n}, () => new Set());
  const order = [...Array(n).keys()].sort((a, b) => adj[b].size - adj[a].size);
  for (const k of order) {
    const blocked = new Set();
    for (const nb of adj[k]) {
      if (groupForRegion[nb] >= 0) blocked.add(groupForRegion[nb]);
    }
    let bestGroup = -1, bestCount = Infinity;
    for (let g = 0; g < COLOR_GROUPS.length; g++) {
      if (blocked.has(g)) continue;
      const cnt = COLOR_GROUPS[g].length;
      if (cnt < bestCount) { bestCount = cnt; bestGroup = g; }
    }
    if (bestGroup === -1) {
      // 所有组都被邻接占用，选冲突最少的
      let minConflict = Infinity;
      for (let g = 0; g < COLOR_GROUPS.length; g++) {
        let conflict = 0;
        for (const nb of adj[k]) if (groupForRegion[nb] === g) conflict++;
        if (conflict < minConflict) { minConflict = conflict; bestGroup = g; }
      }
    }
    groupForRegion[k] = bestGroup;
    usedGroups[k].add(bestGroup);
  }

  // 每组内分配具体颜色，且相邻区域颜色 RGB 距离 > 80
  regionColors = Array(n).fill(-1);
  const colorUsed = new Set();
  const MIN_DIST = 80;
  for (const k of order) {
    const g = groupForRegion[k];
    // 收集邻接区域已用的颜色
    const neighborColors = [];
    for (const nb of adj[k]) {
      if (regionColors[nb] >= 0) {
        neighborColors.push(COLORS[regionColors[nb]]);
      }
    }
    // 先在本色系里找满足距离要求的颜色
    const avail = COLOR_GROUPS[g].filter(c => {
      if (colorUsed.has(c)) return false;
      return neighborColors.every(nc => colorDist(COLORS[c], nc) >= MIN_DIST);
    });
    let pick;
    if (avail.length > 0) {
      pick = avail[Math.floor(Math.random() * avail.length)];
    } else {
      // 本色系没有合适的，从全局找距离最大的
      let best = -1, bestDist = -1;
      for (let c = 0; c < COLORS.length; c++) {
        if (colorUsed.has(c)) continue;
        let minD = neighborColors.length === 0 ? Infinity : Infinity;
        for (const nc of neighborColors) {
          minD = Math.min(minD, colorDist(COLORS[c], nc));
        }
        if (minD > bestDist) { bestDist = minD; best = c; }
      }
      pick = best >= 0 ? best : COLOR_GROUPS[g][0];
    }
    regionColors[k] = pick;
    colorUsed.add(pick);
  }
}

function isUniqueSolution(testCats, origCats) {
  // 检查 testCats 是否是一个不同于 origCats 的合法解
  const n2 = testCats.length;
  const rowSet = new Set(), colSet = new Set(), regSet = new Set();
  for (const [r, c] of testCats) {
    if (rowSet.has(r) || colSet.has(c)) return false;
    const reg = grid[r][c];
    if (regSet.has(reg)) return false;
    rowSet.add(r); colSet.add(c); regSet.add(reg);
  }
  // 8邻接
  for (let a = 0; a < n2; a++) {
    for (let b = a + 1; b < n2; b++) {
      const [r1, c1] = testCats[a];
      const [r2, c2] = testCats[b];
      if (Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1) return false;
    }
  }
  // 是否与原解不同
  const origSet = new Set(origCats.map(([r, c]) => r * 100 + c));
  for (const [r, c] of testCats) {
    if (!origSet.has(r * 100 + c)) return true;
  }
  return false;
}

function placeCats(attempts) {
  if (attempts === undefined) attempts = 0;
  if (attempts > 200) { generateRegions(); return placeCats(0); }

  const solutions = [];
  const rowUsed = Array(n).fill(false);
  const colUsed = Array(n).fill(false);
  const regionUsed = Array(n).fill(false);
  const placed = [];

  function canPlace(r, c, region) {
    if (rowUsed[r] || colUsed[c] || regionUsed[region]) return false;
    for (const [pr, pc] of placed) {
      if (Math.abs(pr - r) <= 1 && Math.abs(pc - c) <= 1) return false;
    }
    return true;
  }

  function backtrack(index) {
    if (solutions.length >= 2) return;
    if (index === n) {
      solutions.push([...placed]);
      return;
    }
    const r = index;
    for (let c = 0; c < n; c++) {
      const region = grid[r][c];
      if (canPlace(r, c, region)) {
        rowUsed[r] = true;
        colUsed[c] = true;
        regionUsed[region] = true;
        placed.push([r, c]);
        backtrack(index + 1);
        rowUsed[r] = false;
        colUsed[c] = false;
        regionUsed[region] = false;
        placed.pop();
      }
    }
  }

  backtrack(0);

  if (solutions.length === 1) {
    // 二次验证：确保没有任何其他合法摆法
    const sol = solutions[0];
    let alternate = false;
    // 对每只猫尝试换到同行其他格子，看是否也能构成合法解
    for (let k = 0; k < sol.length && !alternate; k++) {
      const [r, c] = sol[k];
      for (let c2 = 0; c2 < n; c2++) {
        if (c2 === c) continue;
        const region2 = grid[r][c2];
        // 检查 (r,c2) 替换 (r,c) 后是否满足所有约束
        const testCats = sol.map(([tr, tc], ti) => ti === k ? [r, c2] : [tr, tc]);
        if (isUniqueSolution(testCats, sol)) {
          alternate = true;
          break;
        }
      }
    }
    if (!alternate) {
      cats = Array.from({length: n}, () => Array(n).fill(false));
      for (const [r, c] of sol) cats[r][c] = true;
      return;
    }
  }

  generateRegions();
  placeCats(attempts + 1);
}

function render() {
  const boardEl = document.getElementById('board');
  const cellSize = n <= 6 ? 52 : n <= 8 ? 46 : 40;
  boardEl.style.gridTemplateColumns = `repeat(${n}, ${cellSize}px)`;
  boardEl.innerHTML = '';

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.background = COLORS[regionColors[grid[i][j]]];
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = (cellSize * 0.55) + 'px';
      cell.dataset.row = i;
      cell.dataset.col = j;

      if (revealed[i][j]) {
        cell.classList.add('found');
        cell.textContent = '🐱';
      } else if (noCat[i][j]) {
        cell.classList.add('no-cat');
      }

      cell.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || gameOver) return;
        e.preventDefault();
        mouseDown = true;
        dragActive = false;
        mouseDownCell = {row: i, col: j};
        mouseDownX = e.clientX;
        mouseDownY = e.clientY;
        visitedInDrag = new Set([i * n + j]);
      });

      cell.addEventListener('mouseenter', (e) => {
        if (!mouseDown || gameOver) return;
        const key = i * n + j;
        if (visitedInDrag.has(key)) return;
        const dist = Math.sqrt((e.clientX - mouseDownX) ** 2 + (e.clientY - mouseDownY) ** 2);
        if (dist < 15) return;
        visitedInDrag.add(key);
        if (revealed[i][j]) return;
        if (!dragActive) {
          dragActive = true;
          const {row: si, col: sj} = mouseDownCell;
          if (!revealed[si][sj]) {
            noCat[si][sj] = true;
            updateCell(si, sj);
          }
        }
        noCat[i][j] = true;
        updateCell(i, j);
      });

      // 触摸事件
      cell.addEventListener('touchstart', (e) => {
        if (gameOver) return;
        e.preventDefault();
        const t = e.touches[0];
        mouseDown = true;
        dragActive = false;
        mouseDownCell = {row: i, col: j};
        mouseDownX = t.clientX;
        mouseDownY = t.clientY;
        visitedInDrag = new Set([i * n + j]);
      }, {passive: false});

      boardEl.appendChild(cell);
    }
  }
}

function updateCell(i, j) {
  const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
  if (!cell) return;
  if (revealed[i][j]) {
    if (!cell.classList.contains('found')) {
      cell.classList.remove('no-cat');
      cell.classList.add('found');
      cell.textContent = '🐱';
    }
    return;
  }
  cell.classList.remove('found');
  cell.textContent = '';
  if (noCat[i][j]) {
    cell.classList.add('no-cat');
  } else {
    cell.classList.remove('no-cat');
  }
}

function handleClick(i, j) {
  if (gameOver || revealed[i][j]) return;
  noCat[i][j] = !noCat[i][j];
  updateCell(i, j);
  checkTutorialProgress();
}

function handleDouble(i, j) {
  if (gameOver || revealed[i][j]) return;

  if (cats[i][j]) {
    revealed[i][j] = true;
    noCat[i][j] = false;
    foundCount++;
    updateStatus();
    updateCell(i, j);

    if (foundCount === n) {
      win();
    } else {
      checkTutorialProgress();
    }
  } else {
    lives--;
    updateStatus();

    updateCell(i, j);
    const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
    if (cell) {
      cell.classList.add('wrong');
      setTimeout(() => cell.classList.remove('wrong'), 500);
    }

    if (lives <= 0) {
      lose();
    }
  }
}

function useHint() {
  if (hintCooldown || gameOver) return;

  // 找一只还没被发现的猫
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (cats[i][j] && !revealed[i][j]) {
        revealed[i][j] = true;
        noCat[i][j] = false;
        foundCount++;
        updateStatus();
        updateCell(i, j);
        if (foundCount === n) win();
        startHintCooldown();
        return;
      }
    }
  }
}

function startHintCooldown() {
  hintCooldown = true;
  hintSeconds = 40;
  const btn = document.getElementById('hintBtn');
  btn.classList.add('cooling');
  btn.textContent = `💡 冷却 ${hintSeconds}s`;
  hintTimer = setInterval(() => {
    hintSeconds--;
    if (hintSeconds <= 0) {
      clearInterval(hintTimer);
      hintCooldown = false;
      btn.classList.remove('cooling');
      btn.textContent = '💡 提示';
    } else {
      btn.textContent = `💡 冷却 ${hintSeconds}s`;
    }
  }, 1000);
}

function resetHintButton() {
  clearInterval(hintTimer);
  hintCooldown = false;
  hintSeconds = 0;
  const btn = document.getElementById('hintBtn');
  if (btn) {
    btn.classList.remove('cooling');
    btn.textContent = '💡 提示';
  }
}

function updateStatus() {
  document.getElementById('found').textContent = `${foundCount} / ${n}`;

  let hearts = '';
  for (let i = 0; i < 2; i++) {
    hearts += i < lives ? '❤️' : '🖤';
  }
  document.getElementById('lives').innerHTML = hearts;
}

function win() {
  gameOver = true;
  clearInterval(gameTimer);
  const msg = document.getElementById('message');
  msg.className = 'message win';
  msg.style.display = 'block';
  msg.innerHTML = `🎉 第 ${level} 关通关！<br>找到所有 ${n} 只猫猫！用时 ${seconds} 秒
    <div class="btn-row">
      <button class="btn-next" onclick="nextLevel()">下一关 ➡</button>
      <button class="btn-reset" onclick="resetLevel()">再玩一次</button>
    </div>`;
}

function lose() {
  gameOver = true;
  clearInterval(gameTimer);

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (cats[i][j]) revealed[i][j] = true;
    }
  }
  render();

  const msg = document.getElementById('message');
  msg.className = 'message lose';
  msg.style.display = 'block';
  msg.innerHTML = `💔 第 ${level} 关失败！还差 ${n - foundCount} 只猫猫没找到
    <div class="btn-row">
      <button class="btn-retry" onclick="resetLevel()">再来一次</button>
    </div>`;
}

function nextLevel() {
  newGame(level + 1);
}

function prevLevel() {
  if (level > 1) newGame(level - 1);
}

function resetLevel() {
  // 只清空标记和状态，不重新生成
  clearInterval(gameTimer);
  resetHintButton();
  lives = 2;
  foundCount = 0;
  seconds = 0;
  gameOver = false;
  revealed = Array.from({length: n}, () => Array(n).fill(false));
  noCat = Array.from({length: n}, () => Array(n).fill(false));

  document.getElementById('timer').textContent = '0';
  const msg = document.getElementById('message');
  msg.className = 'message';
  msg.style.display = 'none';

  updateStatus();
  render();

  gameTimer = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = seconds;
  }, 1000);
}

// ===== 新手引导 =====
let tutorialStep = 0; // 0 = 无引导
const TUTORIAL_STEPS = [
  {
    title: '🐱 欢迎来到找猫猫！',
    text: '每个<span class="highlight">颜色区域</span>里都藏着一只猫猫，你的任务是把它们全部找出来！',
    action: 'next'
  },
  {
    title: '📋 游戏规则',
    text: '每<span class="highlight">行</span>、每<span class="highlight">列</span>各有一只猫猫<br>每个<span class="highlight">颜色区域</span>各有一只猫猫<br>猫猫周围<span class="highlight">8 格</span>内不能有其他猫猫',
    action: 'next'
  },
  {
    title: '🔍 看这里！',
    text: '棋盘上有些颜色区域<span class="highlight">只有 1 格</span>——那么猫猫<span class="highlight">一定</span>就藏在那里！先找到这些确定的猫猫。',
    action: 'next'
  },
  {
    title: '👆 操作方法',
    text: '<span class="highlight">双击</span>格子 = 确认猫猫在这里<br><span class="highlight">单击</span>格子 = 标记 ✗ 排除<br><span class="highlight">按住拖动</span> = 批量标记 ✗',
    action: 'next'
  },
  {
    title: '🎮 开始练习！',
    text: '这是一个简单的 5×5 关卡。先找到那些<span class="highlight">只有 1 格</span>的颜色区域，双击找到猫猫吧！',
    action: 'start'
  }
];
let tutStep = 0;

function showTutorial() {
  tutStep = 0;
  renderTutStep();
  document.getElementById('tutorial-overlay').classList.add('show');
}

function renderTutStep() {
  const s = TUTORIAL_STEPS[tutStep];
  document.getElementById('tut-title').textContent = s.title;
  document.getElementById('tut-text').innerHTML = s.text;
  const btn = document.getElementById('tut-btn');
  btn.textContent = tutStep < TUTORIAL_STEPS.length - 1 ? '下一步' : '开始游戏！';
}

function skipTutorial() {
  document.getElementById('tutorial-overlay').classList.remove('show');
  tutorialStep = 0;
  localStorage.setItem('findcats_tutorial_done', '1');
  newGame(1);
}

function tutorialNext() {
  tutStep++;
  if (tutStep >= TUTORIAL_STEPS.length) {
    document.getElementById('tutorial-overlay').classList.remove('show');
    tutorialStep = 0;
    localStorage.setItem('findcats_tutorial_done', '1');
    // 开始教程关卡
    newGame(1);
    showTip('🎯 先找<span style="font-weight:900">只有 1 格</span>的颜色区域，双击那格找到猫猫！', 1);
    return;
  }
  renderTutStep();
}

function showTip(html, step) {
  const tip = document.getElementById('tutorial-tip');
  tip.innerHTML = `<span class="tip-step">引导 ${step}</span>${html}`;
  tip.classList.add('show');
  tutorialStep = step;
}

function hideTip() {
  document.getElementById('tutorial-tip').classList.remove('show');
  tutorialStep = 0;
}

function checkTutorialProgress() {
  if (tutorialStep === 1 && foundCount >= 1) {
    showTip('👍 没错！接下来<span style="font-weight:900">单击</span>任意格子标记 ✗，排除没有猫猫的格子', 2);
  } else if (tutorialStep === 2 && noCat.flat().some(Boolean)) {
    showTip('🎯 很好！继续找猫猫，记住规则：<span style="font-weight:900">每行每列每个颜色区域</span>各一只', 3);
  } else if (tutorialStep === 3 && foundCount >= 2) {
    showTip('🎉 你已经会玩了！找到所有猫猫通关吧！', 4);
    setTimeout(hideTip, 4000);
  }
}

// Init
if (localStorage.getItem('findcats_tutorial_done')) {
  newGame(1);
} else {
  showTutorial();
}

document.addEventListener('mouseup', () => {
  if (!mouseDown) return;
  mouseDown = false;
  if (dragActive) {
    dragActive = false;
    mouseDownCell = null;
    visitedInDrag.clear();
    checkTutorialProgress();
    return;
  }
  if (mouseDownCell) {
    const {row: i, col: j} = mouseDownCell;
    mouseDownCell = null;
    if (clickCell && clickCell.row === i && clickCell.col === j) {
      clearTimeout(clickTimer);
      clickCell = null;
      handleDouble(i, j);
    } else {
      clearTimeout(clickTimer);
      clickCell = {row: i, col: j};
      clickTimer = setTimeout(() => {
        clickCell = null;
        handleClick(i, j);
      }, 280);
    }
  }
});

// 触摸拖拽
document.addEventListener('touchmove', (e) => {
  if (!mouseDown || gameOver) return;
  e.preventDefault();
  const t = e.touches[0];
  const dist = Math.sqrt((t.clientX - mouseDownX) ** 2 + (t.clientY - mouseDownY) ** 2);
  if (dist < 15) return;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (!el || !el.dataset.row) return;
  const i = parseInt(el.dataset.row), j = parseInt(el.dataset.col);
  const key = i * n + j;
  if (visitedInDrag.has(key)) return;
  visitedInDrag.add(key);
  if (revealed[i][j]) return;
  if (!dragActive) {
    dragActive = true;
    const {row: si, col: sj} = mouseDownCell;
    if (!revealed[si][sj]) {
      noCat[si][sj] = true;
      updateCell(si, sj);
    }
  }
  noCat[i][j] = true;
  updateCell(i, j);
}, {passive: false});

// 触摸结束
document.addEventListener('touchend', () => {
  if (!mouseDown) return;
  mouseDown = false;
  if (dragActive) {
    dragActive = false;
    mouseDownCell = null;
    visitedInDrag.clear();
    checkTutorialProgress();
    return;
  }
  if (mouseDownCell) {
    const {row: i, col: j} = mouseDownCell;
    mouseDownCell = null;
    if (clickCell && clickCell.row === i && clickCell.col === j) {
      clearTimeout(clickTimer);
      clickCell = null;
      handleDouble(i, j);
    } else {
      clearTimeout(clickTimer);
      clickCell = {row: i, col: j};
      clickTimer = setTimeout(() => {
        clickCell = null;
        handleClick(i, j);
      }, 300);
    }
  }
});
</script>
